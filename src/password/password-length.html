<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none';" />
    <title>Custom password</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 20px;
        background: #1e1e1e;
        color: #d4d4d4;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color-scheme: dark;
      }
      form { display: flex; flex-direction: column; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      .description { margin: 0 0 14px; color: #999; font-size: 13px; }
      .field-heading { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
      label { font-weight: 600; }
      #help { margin: 0; color: #999; font-size: 12px; }
      input {
        width: 100%;
        height: 42px;
        padding: 8px 12px;
        border: 1px solid #555;
        border-radius: 6px;
        background: #2d2d2d;
        color: #fff;
        font: inherit;
        font-size: 16px;
      }
      input[aria-invalid="true"] { border-color: #ffb4b4; }
      #mode { margin: 12px 0 0; color: #999; font-size: 12px; }
      #status { margin: 8px 0 0; color: #ffb4b4; font-size: 12px; }
      #status:empty { margin: 0; }
      .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      button {
        min-height: 36px;
        padding: 7px 14px;
        border: 1px solid #555;
        border-radius: 6px;
        background: #2d2d2d;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: #383838; }
      button[type="submit"] { background: #007acc; border-color: #007acc; }
      button[type="submit"]:hover:not(:disabled) { background: #0086df; border-color: #0086df; }
      button:disabled { opacity: 0.6; cursor: default; }
      :focus-visible { outline: 2px solid #71c5ff; outline-offset: 2px; }
    </style>
    <script src="./password-length.js" defer></script>
  </head>
  <body>
    <form id="password-form" novalidate aria-busy="true">
      <h1>Custom password</h1>
      <p class="description">Copied to clipboard. Never displayed.</p>
      <div class="field-heading">
        <label for="length">Length</label>
        <p id="help">1–128 characters</p>
      </div>
      <input id="length" name="length" type="number" min="1" max="128" step="1"
        value="16" required autofocus inputmode="numeric" aria-describedby="help status" />
      <p id="mode" aria-live="polite">Loading character settings…</p>
      <p id="status" role="alert" aria-atomic="true"></p>
      <div class="buttons">
        <button id="cancel" type="button">Cancel</button>
        <button id="generate" type="submit" disabled>Generate and copy</button>
      </div>
    </form>
  </body>
</html>
